name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS (AU + VST3, universal) + installer
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-9.0.6-${{ runner.os }}

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --target OPT2A_AU OPT2A_VST3 dsp_test -j 4

      - name: DSP tests
        run: ./build/dsp_test

      - name: Validate with pluginval
        continue-on-error: true
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --validate-in-process "build/OPT2A_artefacts/Release/VST3/OPT-2A.vst3"

      - name: Package (installer + zip)
        run: |
          OUT=dist; mkdir -p $OUT/root/vst3 $OUT/root/au
          cp -R "build/OPT2A_artefacts/Release/VST3/OPT-2A.vst3" $OUT/root/vst3/
          cp -R "build/OPT2A_artefacts/Release/AU/OPT-2A.component" $OUT/root/au/
          codesign --force --deep -s - "$OUT/root/vst3/OPT-2A.vst3" "$OUT/root/au/OPT-2A.component"
          pkgbuild --root $OUT/root/vst3 --install-location "/Library/Audio/Plug-Ins/VST3" --identifier com.herigama.opt2a.vst3 --version 1.0.0 $OUT/vst3.pkg
          pkgbuild --root $OUT/root/au   --install-location "/Library/Audio/Plug-Ins/Components" --identifier com.herigama.opt2a.au --version 1.0.0 $OUT/au.pkg
          productbuild --package $OUT/vst3.pkg --package $OUT/au.pkg "$OUT/OPT-2A-1.0.0-Mac.pkg"
          (cd $OUT/root && zip -qry "../OPT-2A-1.0.0-Mac.zip" vst3 au)

      - uses: actions/upload-artifact@v4
        with:
          name: OPT-2A-Mac
          path: |
            dist/OPT-2A-1.0.0-Mac.pkg
            dist/OPT-2A-1.0.0-Mac.zip

      - name: Publish release (download link)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/opt-2a'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="opt2a-v1.0.0-build${{ github.run_number }}"
          gh release create "$TAG" dist/OPT-2A-1.0.0-Mac.pkg dist/OPT-2A-1.0.0-Mac.zip \
            --title "OPT-2A 1.0.0 (build ${{ github.run_number }})" \
            --notes "Mac installer: AU + VST3, universal (Apple Silicon + Intel). Ad-hoc signed — on first launch, if macOS blocks the installer, right-click it → Open." \
            --latest=false
