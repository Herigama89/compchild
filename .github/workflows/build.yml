name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS (AU + VST3, universal) + installer
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-9.0.6-${{ runner.os }}

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --target Compchild_AU Compchild_VST3 dsp_test -j 4

      - name: DSP tests
        run: ./build/dsp_test

      - name: Validate with pluginval
        continue-on-error: true
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --validate-in-process "build/Compchild_artefacts/Release/VST3/Compchild.vst3"

      - name: Package (installer + zip)
        run: |
          OUT=dist; mkdir -p $OUT/root/vst3 $OUT/root/au
          cp -R "build/Compchild_artefacts/Release/VST3/Compchild.vst3" $OUT/root/vst3/
          cp -R "build/Compchild_artefacts/Release/AU/Compchild.component" $OUT/root/au/
          codesign --force --deep -s - "$OUT/root/vst3/Compchild.vst3" "$OUT/root/au/Compchild.component"
          pkgbuild --root $OUT/root/vst3 --install-location "/Library/Audio/Plug-Ins/VST3" --identifier com.herigama.compchild.vst3 --version 1.1.0 $OUT/vst3.pkg
          pkgbuild --root $OUT/root/au   --install-location "/Library/Audio/Plug-Ins/Components" --identifier com.herigama.compchild.au --version 1.1.0 $OUT/au.pkg
          productbuild --package $OUT/vst3.pkg --package $OUT/au.pkg "$OUT/Compchild-1.1.0-Mac.pkg"
          (cd $OUT/root && zip -qry "../Compchild-1.1.0-Mac.zip" vst3 au)

      - uses: actions/upload-artifact@v4
        with:
          name: Compchild-Mac
          path: |
            dist/Compchild-1.1.0-Mac.pkg
            dist/Compchild-1.1.0-Mac.zip

      - name: Publish release (download link)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.1.0-build${{ github.run_number }}"
          gh release create "$TAG" dist/Compchild-1.1.0-Mac.pkg dist/Compchild-1.1.0-Mac.zip \
            --title "Compchild 1.1.0 (build ${{ github.run_number }})" \
            --notes "Mac installer: AU + VST3, universal (Apple Silicon + Intel). Ad-hoc signed — on first launch, if macOS blocks the installer, right-click it → Open." \
            --latest
