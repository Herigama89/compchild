name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS (AU + VST3, universal) + installer
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-9.0.6-${{ runner.os }}

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --target Compchild_AU Compchild_VST3 dsp_test BlackTube_AU BlackTube_VST3 bt_dsp_test -j 4

      - name: DSP tests
        run: ./build/dsp_test

      - name: Black Tube DSP tests
        run: ./build/BlackTube/bt_dsp_test

      - name: Validate with pluginval
        continue-on-error: true
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --validate-in-process "build/Compchild_artefacts/Release/VST3/Compchild.vst3"

      - name: Package (installer + zip)
        run: |
          OUT=dist; mkdir -p $OUT/root/vst3 $OUT/root/au
          cp -R "build/Compchild_artefacts/Release/VST3/Compchild.vst3" $OUT/root/vst3/
          cp -R "build/Compchild_artefacts/Release/AU/Compchild.component" $OUT/root/au/
          codesign --force --deep -s - "$OUT/root/vst3/Compchild.vst3" "$OUT/root/au/Compchild.component"
          pkgbuild --root $OUT/root/vst3 --install-location "/Library/Audio/Plug-Ins/VST3" --identifier com.herigama.compchild.vst3 --version 1.2.0 $OUT/vst3.pkg
          pkgbuild --root $OUT/root/au   --install-location "/Library/Audio/Plug-Ins/Components" --identifier com.herigama.compchild.au --version 1.2.0 $OUT/au.pkg
          productbuild --package $OUT/vst3.pkg --package $OUT/au.pkg "$OUT/Compchild-1.2.0-Mac.pkg"
          (cd $OUT/root && zip -qry "../Compchild-1.2.0-Mac.zip" vst3 au)

      - name: Validate Black Tube with pluginval
        continue-on-error: true
        run: ./pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --validate-in-process "build/BlackTube/BlackTube_artefacts/Release/VST3/Black Tube.vst3"

      - name: Package Black Tube (installer + zip)
        run: |
          OUT=dist/bt; mkdir -p $OUT/root/vst3 $OUT/root/au
          cp -R "build/BlackTube/BlackTube_artefacts/Release/VST3/Black Tube.vst3" $OUT/root/vst3/
          cp -R "build/BlackTube/BlackTube_artefacts/Release/AU/Black Tube.component" $OUT/root/au/
          codesign --force --deep -s - "$OUT/root/vst3/Black Tube.vst3" "$OUT/root/au/Black Tube.component"
          pkgbuild --root $OUT/root/vst3 --install-location "/Library/Audio/Plug-Ins/VST3" --identifier com.herigama.blacktube.vst3 --version 1.1.0 $OUT/vst3.pkg
          pkgbuild --root $OUT/root/au   --install-location "/Library/Audio/Plug-Ins/Components" --identifier com.herigama.blacktube.au --version 1.0.0 $OUT/au.pkg
          productbuild --package $OUT/vst3.pkg --package $OUT/au.pkg "dist/BlackTube-1.1.0-Mac.pkg"
          (cd $OUT/root && zip -qry "../../BlackTube-1.1.0-Mac.zip" vst3 au)

      - uses: actions/upload-artifact@v4
        with:
          name: BlackTube-Mac
          path: |
            dist/BlackTube-1.1.0-Mac.pkg
            dist/BlackTube-1.1.0-Mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Compchild-Mac
          path: |
            dist/Compchild-1.2.0-Mac.pkg
            dist/Compchild-1.2.0-Mac.zip

      - name: Publish release (download link)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.2.0-build${{ github.run_number }}"
          gh release create "$TAG" dist/Compchild-1.2.0-Mac.pkg dist/Compchild-1.2.0-Mac.zip \
            --title "Compchild 1.2.0 (build ${{ github.run_number }})" \
            --notes "Mac installer: AU + VST3, universal (Apple Silicon + Intel). Ad-hoc signed — on first launch, if macOS blocks the installer, right-click it → Open." \
            --latest

      - name: Publish Black Tube release (download link)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="blacktube-v1.1.0-build${{ github.run_number }}"
          gh release create "$TAG" dist/BlackTube-1.1.0-Mac.pkg dist/BlackTube-1.1.0-Mac.zip \
            --title "Black Tube 1.1.0 (build ${{ github.run_number }})" \
            --notes "Mac installer: AU + VST3, universal (Apple Silicon + Intel). Ad-hoc signed — on first launch, if macOS blocks the installer, right-click it → Open." \
            --latest=false

  windows:
    name: Windows (Black Tube VST3, x64) + installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-9.0.6-${{ runner.os }}

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target BlackTube_VST3 bt_dsp_test -- /m

      - name: Black Tube DSP tests
        run: .\build\BlackTube\Release\bt_dsp_test.exe

      - name: Validate Black Tube with pluginval
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          .\pluginval\pluginval.exe --strictness-level 8 --validate-in-process "build\BlackTube\BlackTube_artefacts\Release\VST3\Black Tube.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Black Tube (installer + zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "build\BlackTube\BlackTube_artefacts\Release\VST3\Black Tube.vst3" -DestinationPath "dist\BlackTube-1.1.0-Windows-VST3.zip"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /DAppVersion=1.1.0 /O"$PWD\dist" BlackTube\installer\BlackTube.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: BlackTube-Windows
          path: |
            dist/BlackTube-1.1.0-Windows-Setup.exe
            dist/BlackTube-1.1.0-Windows-VST3.zip

      - name: Publish Black Tube Windows release (download link)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="blacktube-win-v1.1.0-build${{ github.run_number }}"
          gh release create "$TAG" dist/BlackTube-1.1.0-Windows-Setup.exe dist/BlackTube-1.1.0-Windows-VST3.zip \
            --title "Black Tube 1.1.0 for Windows (build ${{ github.run_number }})" \
            --notes "Windows installer: VST3, 64-bit. Installs to C:\\Program Files\\Common Files\\VST3. Not code-signed — if SmartScreen warns, click More info → Run anyway." \
            --latest=false
